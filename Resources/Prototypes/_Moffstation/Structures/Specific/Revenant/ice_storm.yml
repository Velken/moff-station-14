- type: entity
  id: IceStormCurse
  suffix: Revenant
  components:
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Fixtures
  - type: Sprite
    sprite: Structures/Specific/Anomalies/ice_anom.rsi
    state: anom
  - type: PointLight
    radius: 2.0
    energy: 2.5
    color: "#befaff"
    castShadows: false
  - type: InteractionOutline
  - type: Clickable
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: ProjectileSpawner
    projectilePrototype: ProjectileIcicle
    soundOnShoot: "/Audio/Effects/Weather/snowstorm_weak.ogg"
  - type: SpawnMultipleOnTrigger
    entries:
    - settings:
        minAmount: 5
        maxAmount: 15
        maxRange: 4
      spawns:
      - IceCrust
  #- type: TempAffectingAnomaly
  #  tempChangePerSecond: -25
  #  hotspotExposeTemperature: -1000
  #- type: GasProducerAnomaly
  #  releasedGas: 8 # Frezon. Please replace it if there is a better way to specify this
  #  releaseOnMaxSeverity: true
  #  spawnRadius: 0
  - type: DamageOnInteract
    damage:
      types:
        Cold: 2
    popupText: anomaly-component-contact-damage
  - type: DamageOnAttacked
    damage:
      types:
        Cold: 2
