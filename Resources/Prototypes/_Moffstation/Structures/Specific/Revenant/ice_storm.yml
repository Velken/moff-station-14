- type: entity
  id: IceStormCurse
  suffix: Revenant
  name: Ice Storm
  description: A malevolent ice storm, summoned by an other-worldy entity.
  components:
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Fixtures
  - type: Sprite
    sprite: Structures/Specific/Anomalies/ice_anom.rsi
    state: anom
  - type: PointLight
    radius: 2.0
    energy: 2.5
    color: "#befaff"
    castShadows: false
  - type: InteractionOutline
  - type: Clickable
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: ProjectileSpawner
    projectilePrototype: ProjectileIcicle
    soundOnShoot: "/Audio/Effects/Weather/snowstorm_weak.ogg"
  - type: SpawnMultipleOnTrigger
    entries:
    - settings:
        minAmount: 1
        maxAmount: 5
        maxRange: 6
      spawns:
      - IceCrust
  - type: CreateGasOnTrigger
    releasedGas: 8 # Frezon. Please replace it if there is a better way to specify this
    moleAmount: 1
    spawnRadius: 0
  - type: DamageOnInteract
    damage:
      types:
        Cold: 2
    popupText: anomaly-component-contact-damage
  - type: DamageOnAttacked
    damage:
      types:
        Cold: 2
